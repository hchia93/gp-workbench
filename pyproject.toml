# Metadata and tool config only. The package is run from the repo, not installed:
#   python gp-workbench.py <command>
# Top-level names like src/pdf and src/score would collide in site-packages, so
# there is deliberately no console_scripts entry.

[project]
name = "gp-workbench"
version = "2.0.0"
description = "Guitar Pro 8 workbench: PDF decoding and stem transcription into draft .gp, then in-place annotation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hyrex Chia" }]
dependencies = []

# The PDF route needs nothing. Only the audio route pulls anything in, and its
# collection step needs no admin rights: pip install --user handles both.
[project.optional-dependencies]
audio = ["numpy"]
fetch = ["yt-dlp", "imageio-ffmpeg"]
